<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pulse - Exploring Artificial Intelligence</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }
        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .post-list {
            list-style: none;
            padding: 0;
        }
        .post-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }
        .post-item:last-child {
            border-bottom: none;
        }
        .post-link {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }
        .post-link:hover {
            text-decoration: underline;
        }
        .post-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Pulse</h1>
        <div class="subtitle">Your daily source for artificial intelligence insights, tools, and future trends.</div>
        
        <h2>Latest Posts</h2>
        <ul class="post-list">
            <li class="post-item">
                <a href="post2.html" class="post-link">The Future of AI Tools: What to Expect Next</a>
                <div class="post-date">August 2026</div>
            </li>
            <div class="post-item">
                <a href="post1.html" class="post-link">Welcome to AI Pulse</a>
                <div class="post-date">August 2026</div>
            </li>
        </ul>
    </div>
</body>
</html>
